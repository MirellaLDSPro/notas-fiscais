name: Playwright E2E

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Next.js requires Node >= 20.9.0; use a recent 20.x release
          node-version: '20.10.0'

      - name: Install dependencies (dashboard-app)
        run: |
          cd dashboard-app
          npm ci

      - name: Install Playwright browsers
        run: |
          cd dashboard-app
          npx playwright install --with-deps

      - name: Build and start app
        env:
          NEXTAUTH_URL: "http://localhost:3000"
        run: |
          cd dashboard-app
          npm run build
          # Start Next.js in background
          NEXTAUTH_URL=http://localhost:3000 npm run start &
          # wait for server to be ready
          n=0
          until curl -sSf http://localhost:3000 || [ $n -ge 60 ]; do
            n=$((n+1))
            sleep 1
          done

      - name: Run Playwright tests
        working-directory: dashboard-app
        run: |
          npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: dashboard-app/playwright-report || dashboard-app/playwright-report
